  key_decision: 萧炎要求比试"生死各安天命",并在决斗中公开使用异火(佛怒火莲)
  result: 萧炎击败修为高一星的纳兰嫣然;异火的公开使用连带暴露其"岩枭"伪装身份;引发自刎被阻、烧休书、云棱借故扣留、云山出关、逃离、袭击萧家、击杀云棱、宣布不死不休等连锁后果

