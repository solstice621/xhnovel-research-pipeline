schema_version: "0.2-draft"
id: scene-discovery-v1
window_chars:
  minimum: 8000
  maximum: 12000
overlap_ratio:
  minimum: 0.15
  maximum: 0.20
requirements:
  - discovery_brief is present in every model request
  - only event-facts sources enter scene windows
  - every known observation cites exact normalized-text source spans
  - zero candidates is a successful result
  - candidates remain DRAFT and UNVERIFIED until promoted by a separate review
  - overlapping duplicate candidates are merged deterministically
  - every model attempt and retry has an immutable receipt
