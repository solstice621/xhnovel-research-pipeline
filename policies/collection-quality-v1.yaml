schema_version: "0.2-draft"
id: collection-quality-v1
principle: collector proposes, reviewer independently reassesses, deterministic validators gate
review_mode: INDEPENDENT_BLIND
hard_fail:
  - missing_provider_result
  - missing_or_mismatched_artifact
  - fabricated_url_title_chapter_or_quote
  - snippet_promoted_above_tier_d
  - failed_retrieval_recorded_as_fetched
critical_fields:
  TRIAGE: [disposition, tier]
  CHAPTER_IDENTITY: [identity_status]
conservative_resolution:
  TRIAGE:
    tier: lower_quality_tier
    disposition: LEAD_ONLY_on_disagreement
  CHAPTER_IDENTITY: QUARANTINED
qualification_thresholds:
  artifact_traceability: 1.0
  source_type_accuracy: 0.95
  snippet_false_upgrade_count: 0
  fabricated_reference_count: 0
  chapter_order_accuracy: 1.0
production_review:
  bootstrap: all decisions
  stable:
    - all selected decisions
    - all tier_a_or_b decisions
    - all low_confidence decisions
    - random_rejected_sample
notes:
  - model agreement is not evidence truth
  - a review never upgrades EvidenceExport assurance
  - unresolved critical disagreement prevents quality acceptance
