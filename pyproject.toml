[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "xhnovel-pipeline"
version = "0.2.0.dev0"
description = "Auditable Chinese-novel ingestion and gameplay-scene discovery pipeline"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "jsonschema>=4.20",
  "PyYAML>=6.0",
  "pypdf>=4.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
xhnovel-pipeline = "xhnovel_pipeline.cli:main"
xhnovel-extract = "xhnovel_pipeline.generic_cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.package-data]
xhnovel_pipeline = ["py.typed"]

[tool.setuptools.data-files]
"xhnovel_pipeline_data" = ["pyproject.toml", "requirements.lock"]
"xhnovel_pipeline_data/contracts" = ["contracts/*.json", "contracts/*.md"]
"xhnovel_pipeline_data/contracts/exports" = ["contracts/exports/*.json"]
"xhnovel_pipeline_data/contracts/generic" = ["contracts/generic/*.json"]
"xhnovel_pipeline_data/policies" = ["policies/*.yaml"]
"xhnovel_pipeline_data/profiles/xuanhuan-gameplay-scene-v1" = [
  "profiles/xuanhuan-gameplay-scene-v1/*.json",
  "profiles/xuanhuan-gameplay-scene-v1/*.yaml",
  "profiles/xuanhuan-gameplay-scene-v1/*.md",
]
"xhnovel_pipeline_data/profiles/generic" = ["profiles/generic/*.md"]
"xhnovel_pipeline_data/profiles/generic/geography-v1" = [
  "profiles/generic/geography-v1/*.json",
  "profiles/generic/geography-v1/*.md",
]
"xhnovel_pipeline_data/profiles/generic/race-mention-v1" = [
  "profiles/generic/race-mention-v1/*.json",
  "profiles/generic/race-mention-v1/*.md",
]
