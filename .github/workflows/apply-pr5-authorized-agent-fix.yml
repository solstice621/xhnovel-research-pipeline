name: Apply PR5 authorized-agent attestation fix

on:
  push:
    branches:
      - cursor/standing-attestation-docs-aac8

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cursor/standing-attestation-docs-aac8
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Apply focused contract edits
        shell: python
        run: |
          from pathlib import Path

          def replace(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              if old not in text:
                  raise SystemExit(f"expected text not found in {path}: {old!r}")
              p.write_text(text.replace(old, new), encoding="utf-8")

          skill = ".agents/skills/xhnovel-explore/SKILL.md"
          replace(
              skill,
              "   That attestation must be authored by the operator; the host agent must not write\n"
              "   it. If no such source is available, retain the Lead as `UNRESOLVED` or\n",
              "   The operator may author it directly or explicitly authorize a host agent to\n"
              "   create and sign it on the operator's behalf. An agent must preserve the\n"
              "   principal, delegation scope, and its own identity in the attestation; it must\n"
              "   never infer or self-grant authorization. If no such source is available, retain\n"
              "   the Lead as `UNRESOLVED` or\n",
          )
          replace(
              skill,
              "- write `operator-attestation.json` or otherwise attest rights on the operator's\n"
              "  behalf;\n",
              "- write `operator-attestation.json` without an explicit operator delegation, or\n"
              "  infer/self-grant rights from accessibility, prior runs, or project context;\n",
          )
          Path(".claude/skills/xhnovel-explore/SKILL.md").write_bytes(Path(skill).read_bytes())

          docs = "docs/PHASE0_EXPLORATION.md"
          replace(
              docs,
              "file is an operator-authored rights basis. xhnovel never infers it from HTTP 200, a\n"
              "readable path, or a search snippet, and a host agent must not write it on the\n"
              "operator's behalf.\n",
              "file records an operator-authorized rights basis. The operator may author it\n"
              "directly or explicitly delegate creation and signature to a host agent. A delegated\n"
              "attestation must identify the principal operator, the acting agent, and the scope of\n"
              "the delegation. xhnovel never infers authorization from HTTP 200, a readable path,\n"
              "a search snippet, prior runs, or project context; an agent must not self-authorize.\n",
          )
          replace(
              docs,
              "  operator-attestation.json          # optional; operator-authored, never agent-written\n",
              "  operator-attestation.json          # optional; operator-authored or explicitly delegated\n",
          )

          interface = "docs/PHASE0_INTERFACE.md"
          replace(
              interface,
              "`operator-attestation.json` at the Phase 0 work root as the default rights\n"
              "declaration: it pre-fills a missing `rights` block and binds\n"
              "`operator_attestation_id`. Without that file, prepare still requires an explicit\n",
              "`operator-attestation.json` at the Phase 0 work root as the default rights\n"
              "declaration: it may be authored by the operator or by an agent acting under an\n"
              "explicit, recorded operator delegation; it pre-fills a missing `rights` block and\n"
              "binds `operator_attestation_id`. The agent may not infer or self-grant that\n"
              "delegation. Without that file, prepare still requires an explicit\n",
          )

          readme = "README.md"
          replace(
              readme,
              "work root: the operator declares rights once, and `prepare-handoff` auto-applies\n"
              "them to each SourceDeclaration. Only source\n",
              "work root: the operator declares rights once, directly or through an explicitly\n"
              "authorized agent, and `prepare-handoff` auto-applies them to each\n"
              "SourceDeclaration. Only source\n",
          )

          tests = "tests/test_exploration_skill_contract.py"
          replace(
              tests,
              "def test_standing_operator_attestation_is_operator_authored_not_agent_written():\n"
              "    skill = SKILL.read_text(encoding=\"utf-8\")\n"
              "    docs = DOC.read_text(encoding=\"utf-8\")\n"
              "    for text in (skill, docs):\n"
              "        assert \"operator-attestation.json\" in text\n"
              "        assert \"operator_attestation_id\" in text\n"
              "    step_four = skill.split(\"5. **Prepare through the product boundary.**\", 1)[0]\n"
              "    assert \"4. **Resolve a source.**\" in step_four\n"
              "    assert \"omit\" in step_four.casefold()\n"
              "    assert \"must not write\" in skill.casefold()\n"
              "    assert \"must not write\" in docs.casefold()\n"
              "    assert \"behavior is unchanged\" in docs.casefold() or \"fail-closes\" in docs.casefold()\n",
              "def test_standing_operator_attestation_requires_operator_authority():\n"
              "    skill = SKILL.read_text(encoding=\"utf-8\")\n"
              "    docs = DOC.read_text(encoding=\"utf-8\")\n"
              "    interface = (ROOT / \"docs\" / \"PHASE0_INTERFACE.md\").read_text(encoding=\"utf-8\")\n"
              "    for text in (skill, docs, interface):\n"
              "        assert \"operator-attestation.json\" in text\n"
              "        assert \"operator_attestation_id\" in text\n"
              "        assert \"explicit\" in text.casefold()\n"
              "        assert \"delegat\" in text.casefold()\n"
              "        assert \"self-\" in text.casefold() or \"self \" in text.casefold()\n"
              "    step_four = skill.split(\"5. **Prepare through the product boundary.**\", 1)[0]\n"
              "    assert \"4. **Resolve a source.**\" in step_four\n"
              "    assert \"omit\" in step_four.casefold()\n"
              "    assert \"without an explicit operator delegation\" in skill.casefold()\n"
              "    assert \"behavior is unchanged\" in docs.casefold() or \"fail-closes\" in docs.casefold()\n",
          )
      - name: Install and verify
        run: |
          python -m pip install --upgrade pip build
          python -m pip install -e ".[dev]"
          python scripts/sync_skills.py --check
          python -m compileall src tests scripts
          python -m pytest
          python -m build --wheel
          git diff --check
      - name: Commit focused fix and remove helper workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-pr5-authorized-agent-fix.yml
          git add .agents/skills/xhnovel-explore/SKILL.md \
                  .claude/skills/xhnovel-explore/SKILL.md \
                  README.md \
                  docs/PHASE0_EXPLORATION.md \
                  docs/PHASE0_INTERFACE.md \
                  tests/test_exploration_skill_contract.py
          git commit -m "docs(phase0): allow explicit agent delegation for attestation"
          git push origin HEAD:cursor/standing-attestation-docs-aac8
