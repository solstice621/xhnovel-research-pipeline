name: Apply agent-files stage 2

on:
  push:
    branches: [codex/agent-files-executor]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message == 'chore: apply agent-files stage 2'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python tools/apply_agent_stage2.py
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest
      - run: python -m compileall -q src tests
      - name: Commit integrated stage
        shell: bash
        run: |
          git config user.name 'xhnovel-stage-bot'
          git config user.email '106499495+solstice621@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'feat: integrate agent-files with scene scout'
          git push origin HEAD:codex/agent-files-executor
