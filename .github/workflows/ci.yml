name: CI

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  apply-agent-stage2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python tools/apply_agent_stage2.py
      - name: Restore normal workflow and remove one-shot helpers
        shell: bash
        run: |
          git show HEAD^:.github/workflows/ci.yml > .github/workflows/ci.yml
          rm -f .github/workflows/apply-agent-stage2.yml tools/apply_agent_stage2.py
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest
      - run: python -m compileall -q src tests
      - name: Commit integrated stage
        shell: bash
        run: |
          git config user.name "xhnovel-stage-bot"
          git config user.email "106499495+solstice621@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat: integrate agent-files with scene scout"
          git push origin HEAD:codex/agent-files-executor

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip build
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest
      - run: python -m build --wheel
      - shell: bash
        run: |
          python -m venv wheel-smoke
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            wheel-smoke/Scripts/python -m pip install dist/*.whl
            wheel-smoke/Scripts/python -c "from xhnovel_pipeline.paths import repo_root; root=repo_root(); assert (root/'contracts').is_dir(); assert (root/'profiles').is_dir()"
            wheel-smoke/Scripts/xhnovel-pipeline --help
          else
            wheel-smoke/bin/python -m pip install dist/*.whl
            wheel-smoke/bin/python -c "from xhnovel_pipeline.paths import repo_root; root=repo_root(); assert (root/'contracts').is_dir(); assert (root/'profiles').is_dir()"
            wheel-smoke/bin/xhnovel-pipeline --help
          fi
