name: ci
on:
  push:
  pull_request:
jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - run: python -m pip check
      - run: python -m compileall src tools tests
      - run: python tools/verify_migration_baseline.py
      - run: python fixtures/legacy/sandbox-scripts-ff8b8bb/test_check_evidence_yaml.py
      - run: python -m pytest
      - run: xhnovel-pipeline legacy-check
      - run: xhnovel-pipeline run local-slice fixtures/positive/minimal-local --work-dir .runtime/ci-slice
