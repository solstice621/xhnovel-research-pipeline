name: CI

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip build
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest
      - run: python -m build --wheel
      - shell: bash
        run: |
          python -m venv wheel-smoke
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            wheel-smoke/Scripts/python -m pip install dist/*.whl
            wheel-smoke/Scripts/python -c "from xhnovel_pipeline.paths import repo_root; root=repo_root(); assert (root/'contracts').is_dir(); assert (root/'profiles').is_dir()"
            wheel-smoke/Scripts/xhnovel-pipeline --help
            wheel-smoke/Scripts/python scripts/agent_files_wheel_smoke.py
          else
            wheel-smoke/bin/python -m pip install dist/*.whl
            wheel-smoke/bin/python -c "from xhnovel_pipeline.paths import repo_root; root=repo_root(); assert (root/'contracts').is_dir(); assert (root/'profiles').is_dir()"
            wheel-smoke/bin/xhnovel-pipeline --help
            wheel-smoke/bin/python scripts/agent_files_wheel_smoke.py
          fi
