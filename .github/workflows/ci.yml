name: CI

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip build
      - run: python -m pip install -e ".[dev]"
      - run: python scripts/sync_skills.py --check
      - run: python -m pytest
      - run: python -m build --wheel
      - shell: bash
        run: |
          # Build the wheel venv OUTSIDE the checkout so the installed package's
          # __file__ ancestors do not contain the source pyproject.toml+contracts.
          # This is what proves repo_root() resolves installed package data rather
          # than borrowing the source tree. SMOKE stays an absolute path to the
          # checked-out script; the smoke itself runs each child with cwd in a
          # tempdir, never chdir'ing this process (Windows cleanup safety).
          VENV="$RUNNER_TEMP/xhnovel-wheel-smoke"
          SMOKE="$GITHUB_WORKSPACE/scripts/agent_files_wheel_smoke.py"
          WHEEL=$(ls "$GITHUB_WORKSPACE"/dist/*.whl)
          python -m venv "$VENV"
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            BIN="$VENV/Scripts"
          else
            BIN="$VENV/bin"
          fi
          "$BIN/python" -m pip install "$WHEEL"
          "$BIN/python" -c "from xhnovel_pipeline.paths import repo_root; root=repo_root(); assert (root/'contracts').is_dir(); assert (root/'profiles').is_dir()"
          "$BIN/xhnovel-pipeline" --help
          "$BIN/python" "$SMOKE"
